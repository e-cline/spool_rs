name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly, to catch toolchain regressions (beta, nightly Miri).

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Node parity tests must not silently skip in CI.
  SPOOL_REQUIRE_NODE: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          # The trybuild .stderr files include std source snippets, which
          # rustc only prints when rust-src is installed.
          components: rust-src
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: cargo test --all-targets
        env:
          # Beta's diagnostics differ from the stable wording the trybuild
          # .stderr files pin. Regenerate them (TRYBUILD=overwrite) when
          # stable catches up.
          SPOOL_SKIP_UI: ${{ matrix.toolchain == 'beta' && '1' || '0' }}
      - run: cargo test --doc
      - name: Stress tests
        if: github.event_name == 'schedule'
        run: cargo test --release --test stress -- --ignored

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rust-src
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Line coverage (at least 90%)
        run: cargo llvm-cov --all-targets --fail-under-lines 90 --summary-only

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo doc --no-deps
      - name: Benchmarks compile
        run: cargo bench --no-run

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test
        env:
          # Threads + `thread::sleep` in tests/remote.rs need real time.
          MIRIFLAGS: -Zmiri-disable-isolation
          RUSTFLAGS: ""
