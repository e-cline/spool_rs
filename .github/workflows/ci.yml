name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly, to catch toolchain regressions (beta, nightly Miri).

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          # The trybuild .stderr files include std source snippets, which
          # rustc only prints when rust-src is installed.
          components: rust-src
      - run: cargo test --all-targets
        env:
          # Beta's diagnostics differ from the stable wording the trybuild
          # .stderr files pin. Regenerate them (TRYBUILD=overwrite) when
          # stable catches up.
          SPOOLY_SKIP_UI: ${{ matrix.toolchain == 'beta' && '1' || '0' }}
      - run: cargo test --doc
      - name: Stress tests
        if: github.event_name == 'schedule'
        run: cargo test --release --test stress -- --ignored

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rust-src
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Line coverage (at least 90%)
        run: cargo llvm-cov --all-targets --fail-under-lines 90 --summary-only

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo doc --no-deps
      - name: Clippy and docs for the browser (includes the browser example)
        run: |
          cargo clippy --all-targets --target wasm32-unknown-unknown --features browser
          cargo doc --no-deps --target wasm32-unknown-unknown --features browser
      - name: Benchmarks compile
        run: cargo bench --no-run

  wasm:
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Without features. The browser job tests `wasm32-unknown-unknown`
      # with `browser`; M10 adds the WASI tests.
      - run: cargo check --target ${{ matrix.target }}

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's preinstalled drivers match its browsers.
          - browser: chrome
            driver: --chromedriver $CHROMEWEBDRIVER/chromedriver
          - browser: firefox
            driver: --geckodriver $GECKOWEBDRIVER/geckodriver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - name: Test suite in a headless browser
        run: wasm-pack test --headless --${{ matrix.browser }} ${{ matrix.driver }} -- --features browser
        env:
          # Run every test in the browser, not in Node.
          WASM_BINDGEN_USE_BROWSER: "1"

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test
        env:
          # Threads + `thread::sleep` in tests/remote.rs need real time.
          MIRIFLAGS: -Zmiri-disable-isolation
          RUSTFLAGS: ""
