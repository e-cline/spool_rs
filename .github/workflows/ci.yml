name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly, to catch toolchain regressions (beta, nightly Miri).

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Normally ~1-2 min (stress tests weekly); fail a hang fast.
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          # The trybuild .stderr files include std source snippets, which
          # rustc only prints when rust-src is installed.
          components: rust-src
      - run: cargo test --workspace --all-targets
        env:
          # Beta's diagnostics differ from the stable wording the trybuild
          # .stderr files pin. Regenerate them (TRYBUILD=overwrite) when
          # stable catches up.
          SPOOLY_SKIP_UI: ${{ matrix.toolchain == 'beta' && '1' || '0' }}
      - run: cargo test --workspace --doc
      - name: Stress tests
        if: github.event_name == 'schedule'
        run: cargo test --release -p spooly --test stress -- --ignored

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rust-src
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Line coverage (at least 90%)
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 90 --summary-only

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --workspace --no-deps
      - name: Clippy and docs for the browser (includes the browser example)
        run: |
          cargo clippy -p spooly --all-targets --target wasm32-unknown-unknown --features browser
          cargo doc -p spooly --no-deps --target wasm32-unknown-unknown --features browser
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  wasm:
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Without features. The browser job tests `wasm32-unknown-unknown`
      # with `browser`, and the wasi job tests `wasm32-wasip2`.
      - run: cargo check --workspace --target ${{ matrix.target }}

  wasi:
    name: wasi (wasm32-wasip2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo clippy -p spooly --all-targets --target wasm32-wasip2
      # The core's suite under wasmtime (the runner is set in
      # .cargo/config.toml); tests that need threads or catch panics are
      # ignored there. Not the doctests: they are merged into one binary,
      # which the first one using a thread aborts, and they run natively.
      # spooly-io's tests need sockets: M16.
      - name: Test suite under wasmtime
        run: cargo test -p spooly --target wasm32-wasip2 --lib --tests

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's preinstalled drivers match its browsers.
          - browser: chrome
            driver: --chromedriver $CHROMEWEBDRIVER/chromedriver
          - browser: firefox
            driver: --geckodriver $GECKOWEBDRIVER/geckodriver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - name: Test suite in a headless browser
        run: wasm-pack test --headless --${{ matrix.browser }} ${{ matrix.driver }} crates/spooly --features browser
        env:
          # Run every test in the browser, not in Node.
          WASM_BINDGEN_USE_BROWSER: "1"

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Normally ~15 min.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The core only: spooly-io's tests use real sockets, which Miri
      # can't run.
      - run: cargo miri test -p spooly
        env:
          # Threads + `thread::sleep` in tests/remote.rs need real time.
          MIRIFLAGS: -Zmiri-disable-isolation
          RUSTFLAGS: ""
