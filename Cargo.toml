[package]
name = "spool"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A lightweight, single-threaded async executor with Node.js-like semantics. No Send/Sync required."
license = "MIT"
repository = "https://github.com/e-cline/spool_rs"
readme = "README.md"
keywords = ["async", "executor", "runtime", "single-threaded", "event-loop"]
categories = ["asynchronous"]
publish = false

[dependencies]
# Intentionally empty: Spool has zero runtime dependencies.

[dev-dependencies]
proptest = "1"
static_assertions = "1"
trybuild = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
