[package]
name = "spooly"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A lightweight, single-threaded async executor inspired by the JavaScript event loop. No Send/Sync required."
license = "MIT"
repository = "https://github.com/e-cline/spooly"
readme = "README.md"
keywords = ["async", "executor", "runtime", "single-threaded", "event-loop"]
categories = ["asynchronous"]
publish = false

[features]
# The browser driver and `PerformanceClock`, for `wasm32-unknown-unknown`
# (see the `browser` module). It does nothing on other targets.
browser = ["dep:wasm-bindgen"]

[dependencies]
# Kept minimal: each dependency must earn its place. None are needed on
# native targets today.

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.100", optional = true }

[dev-dependencies]
futures = "0.3.34" # For `join!` in examples/intervals.rs.
static_assertions = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"
trybuild = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "browser"
path = "examples/browser/main.rs"
crate-type = ["cdylib"]
required-features = ["browser"]

[[bench]]
name = "throughput"
harness = false
