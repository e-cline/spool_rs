[workspace]
resolver = "3"
members = ["crates/*"]

# Shared by every crate. Each crate keeps its own `version`, so they can be
# released at their own pace.
[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/e-cline/spooly"

# Versions for the whole workspace. Crates opt in with `dep.workspace = true`.
# Runtime dependencies are kept minimal: each one must earn its place.
[workspace.dependencies]
spooly = { path = "crates/spooly" }
wasm-bindgen = "0.2.100"
mio = { version = "1.2.4", default-features = false }
socket2 = "0.6.5"
futures-io = "0.3.34"

# Test-only.
futures = "0.3.34"
proptest = "1"
static_assertions = "1"
trybuild = "1"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
