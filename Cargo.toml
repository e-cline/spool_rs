[package]
name = "spooly"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A lightweight, single-threaded async executor inspired by the JavaScript event loop. No Send/Sync required."
license = "MIT"
repository = "https://github.com/e-cline/spooly"
readme = "README.md"
keywords = ["async", "executor", "runtime", "single-threaded", "event-loop"]
categories = ["asynchronous"]
publish = false

[dependencies]
# Intentionally empty: Spooly has zero runtime dependencies on native targets.

[dev-dependencies]
futures = "0.3.34" # For `join!` in examples/intervals.rs.
proptest = "1"
static_assertions = "1"
trybuild = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bench]]
name = "throughput"
harness = false
