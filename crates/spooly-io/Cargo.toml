[package]
name = "spooly-io"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Async network I/O for the Spooly executor. No Send/Sync required."
license.workspace = true
repository.workspace = true
keywords = ["async", "io", "net", "single-threaded", "event-loop"]
categories = ["asynchronous", "network-programming"]
publish = false

[dependencies]
futures-io.workspace = true
spooly.workspace = true

# The reactor (IO1), on WASI 0.2 too (IO15). The browser has none (IO8).
[target.'cfg(any(unix, windows, all(target_os = "wasi", target_env = "p2")))'.dependencies]
mio = { workspace = true, features = ["os-poll", "net"] }

# `SourceFd`, for `Async<T>` (Unix only).
[target.'cfg(unix)'.dependencies]
mio = { workspace = true, features = ["os-ext"] }

[dev-dependencies]
futures.workspace = true
socket2.workspace = true

[lints]
workspace = true
